services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: kwi-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:///./kwi_municipal.db
    volumes:
      - ./Backend:/app
      - /app/venv
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: kwi-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_GOOGLE_CLIENT_ID=720592181985-nl0vbi1spjvavemtnri1ufb9ib1knlic.apps.googleusercontent.com
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
