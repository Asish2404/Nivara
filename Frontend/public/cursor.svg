<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 32 32" fill="none">
  <defs>
    <filter id="paperPlaneShadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0.5" dy="0.8" stdDeviation="0.6" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#paperPlaneShadow)">
    <!-- White outer rim for ultra-high contrast on both dark and light modes -->
    <!-- Full Paper Plane Boundary -->
    <path
      d="M3 3 L28 9 L21.5 16 L21.5 21 L17 18 L14 26 Z"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="2.6"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Main Outer Paper Plane Outline (Bold Black matching reference) -->
    <path
      d="M3 3 L28 9 L21.5 16 L21.5 21 L17 18 L14 26 Z"
      fill="#0f172a"
      stroke="#000000"
      stroke-width="2.2"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Left Wing Interior (Crisp light fill) -->
    <path
      d="M3.5 3.5 L13.8 25 L16.8 17.5 L3.5 3.5 Z"
      fill="#f8fafc"
      stroke="#000000"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Right Wing Interior -->
    <path
      d="M3.5 3.5 L27 8.8 L21 15.6 L3.5 3.5 Z"
      fill="#ffffff"
      stroke="#000000"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Center Spine Fold Line -->
    <line
      x1="3"
      y1="3"
      x2="21.5"
      y2="16"
      stroke="#000000"
      stroke-width="2.2"
      stroke-linecap="round"
    />

    <!-- Rear Keel Fold (Filled Black Triangle matching reference) -->
    <path
      d="M17 17.5 L21.5 15.8 L21.5 21 Z"
      fill="#000000"
      stroke="#000000"
      stroke-width="0.8"
    />

    <!-- Precision Apex Tip Hotspot Highlight -->
    <circle cx="3" cy="3" r="0.75" fill="#000000" />
  </g>
</svg>
